# GAP agent manifest. Edit freely — this is yours.
apiVersion: gitagent/v1
kind: Agent

metadata:
  name: jr-arch
  description: Coding agent harness with editable personas and harness-enforced guardrails.
  version: 0.1.0

# Your model, your key. Nothing is pinned by this tool.
# api_key_env is the NAME of the variable holding your key, never the key.
# The key itself goes in .gitagent/.env as NAME=value — that file is
# gitignored; this one is committed.
model:
  provider: anthropic          # anthropic | openai | ollama | openai-compatible
  name: claude-sonnet-4-6
  api_key_env: ANTHROPIC_API_KEY
  base_url: null               # set for ollama / vLLM / OpenRouter / LM Studio
  temperature: 0.2
  max_tokens: 8192
  # What this key allows per minute, measured from the provider's own headers
  # at setup and refreshed by `jr-arch limits`. Every request is fitted under
  # it: the reply cap shrinks first, then the oldest tool output is dropped.
  # Delete it to send requests unfitted.
  # tokens_per_minute: 8000

hooks: hooks/hooks.yaml

# How a run uses git. These are read from THIS file.
git:
  session_branch: true         # false: work on the current branch
  branch_prefix: jr-arch       # branches are <prefix>/session-<id>
  auto_commit: true            # false: leave verified work uncommitted

# Per-tier model overrides. Delete this block to run one model everywhere.
# Anything a tier does not name is inherited from model: above, so a tier can
# change just the model and keep your provider and key.
#
# tiers:
#   junior-dev:
#     model:
#       provider: openai
#       name: gpt-4o-mini
#       api_key_env: OPENAI_API_KEY     # jr-arch key --env OPENAI_API_KEY <k>
#   senior-dev:
#     model:
#       name: claude-opus-4-1           # same provider, same key, bigger model

routing:
  entry: auto                  # auto, or the name of an installed agent
  default_attempts: 2          # tries per agent, unless its SOUL.md declares
                               # its own `attempts:`
  max_steps: 40                # tool calls per attempt; a loop on a failing
                               # test burns your key quietly without a ceiling
  context_budget: 6000         # characters of compiled handoff context. The
                               # successor gets a record, never a transcript —
                               # task and objective are never trimmed away.
  classifier_confidence_floor: 0.6
  # Where a task goes when the model cannot classify it. Unset means the last
  # agent by priority, which is right whatever your agents are called — name
  # one here only if you want a different answer.
  # degraded_fallback: senior-dev
  #
  # Optional: pick the entry agent with a System One model instead of the model
  # above. It returns one option out of your installed agents with a CALIBRATED
  # probability, which is what classifier_confidence_floor above is really
  # asking for — a model's estimate of its own answer is a guess about a guess.
  #
  # Commented out on purpose. Switching it on sends the task text and the
  # repository's file list to a SECOND provider, so it is yours to turn on, not
  # ours. Everything else about the run is unchanged, and if the call fails or
  # the key is missing the model above classifies as it does today.
  #
  # classifier:
  #   provider: typesafe          # key from console.typesafe.ai/settings/keys
  #   api_key_env: TYPESAFE_API_KEY
